name: BrewLite CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install dependencies (API & Web)
        run: |
          cd apps/api && npm install
          cd ../web && npm install
          
      - name: Check Lint and Test (API)
        run: |
          cd apps/api
          npm run lint
          npm run test